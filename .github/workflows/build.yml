name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Chạy Buildozer đóng gói APK
        run: |
          # Đồng ý tự động mọi bản quyền và chạy build
          yes | buildozer -v android debug

      - name: Lưu trữ file APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
          retention-days: 7
          

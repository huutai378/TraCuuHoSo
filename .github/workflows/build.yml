name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Dọn dẹp dung lượng ổ đĩa
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Cài đặt Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài đặt các gói phụ thuộc hệ thống
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Cài đặt Cython và Buildozer
        run: |
          pip install --upgrade pip
          pip install "Cython<3.0.0"
          pip install buildozer

      - name: Build ứng dụng Android với Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Lưu trữ file APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: bin/*.apk
          

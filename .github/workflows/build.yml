name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cài đặt các gói phụ thuộc hệ thống
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libunwind-dev \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            libssl-dev \
            openssl \
            libffi-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            pkg-config \
            autoconf \
            automake \
            libtool \
            cmake \
            zip \
            unzip

      - name: Cài đặt Cython và Buildozer
        run: |
          pip install --upgrade pip
          pip install --upgrade "cython<3.0"
          pip install --upgrade buildozer

      - name: Build ứng dụng Android với Buildozer
        run: |
          buildozer android debug

      - name: Lưu trữ file APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
          
